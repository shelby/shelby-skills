# Releases the version in .claude-plugin/plugin.json. When a change to it reaches main,
# this tags v<version> and creates a GitHub Release with generated notes. Installed
# plugins update only when that version changes, so bump it in a pull request to release.
# Skips versions that are already tagged; run it by hand to retry a failed release.
name: Release

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the synced files
        if: steps.version.outputs.version
        run: python3 scripts/sync-quickstart.py --check

      - name: Tag and release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
