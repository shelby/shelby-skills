# Fails if the synced parts of skills/shelby-s3 differ from the shelby-quickstart commit
# pinned in quickstart.lock.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/sync-quickstart.py --check
